name: Downstream workflow

on:
  workflow_dispatch:
    inputs:
      component:
        description: "component to test"
        type: string
      max_test_timeout:
        description: "test job timeout"
        type: string

  workflow_call:
    inputs:
      component:
        description: "component to test"
        type: string
      max_test_timeout:
        description: "test job timeout"
        type: string
     
run-name: Test ${{ inputs.component }}

permissions:
  contents: read

jobs:
  Sleeping:
    name: Testing
    runs-on: ubuntu-24.04
    steps:
      - name: Sleeping step
        run: |
          echo "Testing ${{ inputs.component }}"
          sleep ${{ inputs.max_test_timeout }}
      - name: failed step
        run: exit 100