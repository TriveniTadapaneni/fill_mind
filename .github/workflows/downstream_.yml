name: Downstream workflow

on:
  workflow_dispatch:
    inputs:
      component:
        description: "component to test"
        type: string
      max_test_timeout:
        description: "Test duration in seconds"
        default: "1200"
        type: string

  workflow_call:
    inputs:
      component:
        description: "component to test"
        type: string
      max_test_timeout:
        description: "Test duration in seconds"
        default: "1200"
        type: string
     
run-name: Test ${{ inputs.component }}

permissions:
  contents: read

jobs:
  Sleeping:
    name: Testing
    runs-on: ubuntu-24.04
    steps:
      - name: Sleeping step
        env:
          COMPONENT: ${{ inputs.component }}
          TEST_DURATION: ${{ inputs.max_test_timeout }}
        run: |
          echo "Testing $COMPONENT"
          sleep "$TEST_DURATION"
      - name: failed step
        run: exit 100