name: Downstream workflow

on:
  workflow_dispatch:
    inputs:
      max_retries:
        description: "Additional retry attempts after the first (default 2 = 3 total attempts)"
        type: string
        default: "2"
  workflow_call:
    inputs:
      max_retries:
        description: "Additional retry attempts after the first (default 2 = 3 total attempts)"
        type: string
        default: "2"
     

permissions:
  contents: read

jobs:
  Sleeping:
    name: Sleeping
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        max_retries : ["21", "10" , "5"]
    steps:
      - name: Sleeping step
        run: |
          sleep 20
          echo ${{ matrix.max_retries }}

      - name: failed step
        run: exit 100