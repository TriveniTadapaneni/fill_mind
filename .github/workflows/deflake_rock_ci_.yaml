name: De-flake Job

on:
  workflow_dispatch:
    inputs:
      max_retries:
        description: "Additional retry attempts after downstream job frist failure"
        type: string
        default: "5"
      max_test_timeout:
        description: "downstream job max timeout in seconds"
        type: string
        default: "43200"

permissions:
  contents: read
  actions: write
  checks: read
  id-token: write

jobs:
  find_baseline_run:
    name: Trigger downstream workflow
    runs-on: ubuntu-24.04
    strategy:
      fail-fast : false
      matrix:
        component : ["rocblas", "hipblas" , "rocwmma"]
    steps:
      - name: Dispatch downstream run
        id: dispatch
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: downstream_.yml
          ref: main
          wait-for-completion: true
          wait-timeout-seconds: 10800
          wait-interval-seconds: 900
          inputs: |
            { 
              "component": "${{ matrix.component }}",
              "max_test_timeout": "${{ inputs.max_test_timeout }}"
            }

      - name: check the status of the first run
        id: run_status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.runId }}
          REPO: ${{ github.repository }}
        run: |
            status=$(gh run view "${RUN_ID}" \
              --repo "${REPO}" \
              --json conclusion \
              -q .conclusion)
            echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Retry failed jobs
        if: ${{ steps.run_status.outputs.status == 'failure' || steps.run_status.outputs.status == 'timed_out' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.runId }}
          REPO: ${{ github.repository }}
        run: |
          max_retries=${{ inputs.max_retries }}

          status=$(gh run view "${RUN_ID}" \
            --repo "${REPO}" \
            --json conclusion \
            -q .conclusion)

          if [ "$status" = "success" ]; then
            echo "Workflow succeeded without retries"
            exit 0
          fi

          for attempt in $(seq 1 $max_retries); do
            echo "Retry attempt $attempt"

            gh api \
              -X POST \
              "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"

            # Wait for rerun to complete
            # Inspect the conclusion below so a failed run does not stop Bash -e.
            gh run watch "${RUN_ID}" --repo "${REPO}"

            status=$(gh run view "${RUN_ID}" \
              --repo "${REPO}" \
              --json conclusion \
              -q .conclusion)

            echo "Conclusion: $status"

            if [ "$status" = "success" ]; then
              echo "Workflow succeeded after retry"
              exit 0
            fi
          done

          echo "::error::Workflow did not succeed after $max_retries retries (conclusion: $status)"
          exit 1
