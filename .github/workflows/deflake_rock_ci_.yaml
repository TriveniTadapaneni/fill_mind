name: De-flake Job

on:
  workflow_dispatch:
    inputs:
      max_retries:
        description: "Additional failed-job retries (2 = 3 total attempts)"
        type: string
        default: "2"
      max_test_timeout:
        description: "Downstream test duration in seconds (1–18000)"
        type: string
        default: "1200"
      poll_interval:
        description: "Seconds between run-status checks (30–900)"
        type: string
        default: "60"
      monitor_timeout_minutes:
        description: "Total monitoring budget including retries (1–350 minutes)"
        type: string
        default: "350"

permissions:
  contents: read
  actions: write

jobs:
  trigger_monitor_retry:
    name: Trigger, monitor and retry (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        component: [rocblas, hipblas, rocwmma]
    env:
      MAX_RETRIES: ${{ inputs.max_retries }}
      TEST_DURATION: ${{ inputs.max_test_timeout }}
      POLL_INTERVAL: ${{ inputs.poll_interval }}
      MONITOR_TIMEOUT_MINUTES: ${{ inputs.monitor_timeout_minutes }}
    steps:
      - name: Checkout controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate inputs before dispatch
        run: python3 scripts/monitor_run.py --validate-only

      - name: Dispatch downstream run once
        id: dispatch
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: downstream_.yml
          ref: main
          wait-for-completion: false
          inputs: |
            {
              "component": "${{ matrix.component }}",
              "max_test_timeout": "${{ inputs.max_test_timeout }}"
            }

      - name: Monitor and rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.runId }}
          REPO: ${{ github.repository }}
        run: python3 scripts/monitor_run.py
