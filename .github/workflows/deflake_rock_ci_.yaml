name: De-flake Job

on:
  workflow_dispatch:
    inputs:
      max_retries:
        description: "Additional retry attempts after the first (default 2 = 3 total attempts)"
        type: string
        default: "2"
      amdgpu_families:
        description: "Comma-separated arch subset override (blank = all enabled)"
        type: string
        default: ""

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  find_baseline_run:
    name: Trigger downstream workflow
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        max_retries : ["21", "10" , "5"]
    steps:
      - name: Dispatch downstream run
        id: dispatch
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: downstream_.yml
          ref: main
          wait-for-completion: true
          inputs: |
            { 
              "max_retries": "${{ matrix.max_retries }}"
            }

      - name: Retry failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.runId }}
          REPO: ${{ github.repository }}
        run: |
          max_retries=3
          gh --version
          for attempt in $(seq 1 $max_retries); do
            echo "Retry attempt $attempt"

            gh api \
              -X POST \
              repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs

            # Wait for rerun to complete
            gh run watch ${RUN_ID} \
              --repo ${REPO} \
              --exit-status

            status=$(gh run view ${RUN_ID} \
              --repo ${REPO} \
              --json conclusion \
              -q .conclusion)

            echo "Conclusion: $status"

            if [ "$status" = "success" ]; then
              echo "Workflow succeeded after retry"
              exit 0
            fi
          done

          echo "Workflow still failing after $max_retries retries"
          exit 1