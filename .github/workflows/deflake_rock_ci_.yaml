name: De-flake Job

on:
  workflow_dispatch:
    inputs:
      max_retries:
        description: "Additional retry attempts after the first (default 2 = 3 total attempts)"
        type: string
        default: "2"
      amdgpu_families:
        description: "Comma-separated arch subset override (blank = all enabled)"
        type: string
        default: ""

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  find_baseline_run:
    name: Trigger downstream workflow
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        max_retries : ["21", "10" , "5"]
    steps:
      - name: Dispatch test_artifacts.yml
        id: dispatch
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: downstream_.yml
          ref: main
          wait-for-completion: true
          inputs: |
            { 
              "max_retries": ${{ matrix.max_retries }}
            }

      - name: All jobs completed
        run: echo "Done !!!"